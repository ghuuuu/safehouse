# Safehouse — one app container, one database container, nothing else.
#
#   docker compose up --build
#
# See DECISIONS.md D3 (self-hosted, Docker Compose) and D9 (no second service
# unless something genuinely cannot work without it).

name: safehouse

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: safehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safehouse-dev}
      POSTGRES_DB: safehouse
    volumes:
      # Postgres 18+ images expect the mount at /var/lib/postgresql, not at
      # .../data — the older path makes the container refuse to start.
      - db-data:/var/lib/postgresql
    ports:
      # Loopback only, so `npm run dev` and the backup, drill and migrate
      # commands on this machine can reach the database. Never widen it to
      # 0.0.0.0: Postgres stays unreachable from outside this machine.
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safehouse -d safehouse"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # The application gets the restricted role only. The owner password is
      # deliberately absent from this container: a bug in the app cannot reach
      # for a connection that bypasses row-level security if it does not have
      # one (D11). Migrations are run from the host with DATABASE_URL.
      APP_DATABASE_URL: postgres://safehouse_app:${APP_DB_PASSWORD:-safehouse-app-dev}@db:5432/safehouse
      # The sign-in code's own role. It can write accounts and sessions and can
      # read nothing else — no records, no documents, no files (D24).
      AUTH_DATABASE_URL: postgres://safehouse_auth:${AUTH_DB_PASSWORD:-safehouse-auth-dev}@db:5432/safehouse
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4020}
      # The key-encryption key arrives as a secret, mounted read-only, and is
      # read once at boot (D12). It is never in the database and never in the
      # documents volume, so neither of those alone is worth anything.
      SAFEHOUSE_KEY_FILE: /run/secrets/safehouse_key
      # Encrypted document files. Sealed before they get here.
      SAFEHOUSE_STORAGE_DIR: /var/lib/safehouse/documents
      # Optional: expiry and break-glass alerts beyond the app (D37). Empty
      # keeps them in the app only.
      SAFEHOUSE_NOTIFY_WEBHOOK: ${SAFEHOUSE_NOTIFY_WEBHOOK:-}
    secrets:
      - safehouse_key
    volumes:
      # A host directory, not a named volume, so `npm run backup` and
      # `npm run restore` on the host reach the same files the app writes
      # (D38). The app runs as uid 1000; create the directory before the first
      # `up` and give it to that uid, or the server refuses to start.
      - ${SAFEHOUSE_STORAGE_DIR:-./storage}:/var/lib/safehouse/documents
    ports:
      - "4020:3000"
    depends_on:
      db:
        condition: service_healthy

secrets:
  safehouse_key:
    # Generate it with `npm run key:make` before the first `docker compose up`.
    file: ./keys/safehouse.key

volumes:
  # The documents are not here: they are the host directory above. A backup
  # of one without the other is useless, and both without the key file are
  # useless (D6, D12).
  db-data:
